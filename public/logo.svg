<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#dropShadow)" />

  <!-- Inner Gold Ring Accent -->
  <rect x="36" y="36" width="440" height="440" rx="76" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6" />

  <!-- Central Shield Badge -->
  <path d="M 256 96 C 330 96, 380 116, 380 116 C 380 260, 320 370, 256 416 C 192 370, 132 260, 132 116 C 132 116, 182 96, 256 96 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#dropShadow)" />

  <!-- Gold Emblem Shield Ribbon Accent -->
  <path d="M 256 120 C 315 120, 356 136, 356 136 C 356 248, 306 342, 256 384 C 206 342, 156 248, 156 136 C 156 136, 197 120, 256 120 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Geofence Pin Group -->
  <g transform="translate(0, -10)">
    <!-- Location Pin Outer -->
    <path d="M 256 160 C 218 160, 188 190, 188 228 C 188 280, 256 340, 256 340 C 256 340, 324 280, 324 228 C 324 190, 294 160, 256 160 Z" fill="url(#amberGrad)" stroke="url(#goldGrad)" stroke-width="6" />

    <!-- Pin Inner Circle Base -->
    <circle cx="256" cy="224" r="28" fill="#1C1917" stroke="url(#goldGrad)" stroke-width="4" />

    <!-- Clock / Verification Checkmark inside Pin -->
    <path d="M 246 224 L 253 231 L 268 216" fill="none" stroke="#FEF08A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Authority Banner Stars -->
  <polygon points="216,368 221,378 232,379 224,387 226,398 216,392 206,398 208,387 200,379 211,378" fill="url(#goldGrad)" />
  <polygon points="256,380 261,390 272,391 264,399 266,410 256,404 246,410 248,399 240,391 251,390" fill="url(#goldGrad)" />
  <polygon points="296,368 301,378 312,379 304,387 306,398 296,392 286,398 288,387 280,379 291,378" fill="url(#goldGrad)" />

  <!-- Text: GEOATTENDANCE -->
  <text x="256" y="448" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="4" fill="url(#goldGrad)" text-anchor="middle">
    GEOATTENDANCE
  </text>
  
  <!-- Text: AUTHORITY -->
  <text x="256" y="470" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="6" fill="#A8A29E" text-anchor="middle">
    AUTHORITY
  </text>
</svg>
